<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#grad)" stroke-width="4" opacity="0.4" />
  
  <!-- Headphones and Sound Wave -->
  <g filter="url(#glow)">
    <!-- Headphone Arc -->
    <path d="M136 260 C136 150, 376 150, 376 260" fill="none" stroke="url(#grad)" stroke-width="28" stroke-linecap="round" />
    
    <!-- Sound Waves in Center -->
    <rect x="200" y="220" width="16" height="80" rx="8" fill="url(#grad)" />
    <rect x="232" y="190" width="16" height="140" rx="8" fill="url(#grad)" />
    <rect x="264" y="170" width="16" height="180" rx="8" fill="url(#grad)" />
    <rect x="296" y="200" width="16" height="120" rx="8" fill="url(#grad)" />
    
    <!-- Left Ear Cup -->
    <rect x="116" y="240" width="38" height="90" rx="19" fill="url(#grad)" />
    <!-- Right Ear Cup -->
    <rect x="358" y="240" width="38" height="90" rx="19" fill="url(#grad)" />
  </g>
</svg>
